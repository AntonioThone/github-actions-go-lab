on:
  push:

  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-gov@v5
        with:
          go-verison: "1.23"
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Run Tests
        run: go test ./...

  healthcheck:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix. os}}

    steps:

      - name: API Status
        run: echo "API saudavel"
