name: Go CI

on:
  push:

  workflow_dispatch:

  schedule:
    - cron: "0 7 * * *"

jobs:

  test:

    strategy:
      matrix:

        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Código não formatado"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Validate Secret
        run: echo "Secret configurado"

      - name: Run Tests
        run: go test ./...

      - name: Create Report
        run: |
          mkdir -p reports
          echo "Todos os testes passaram" > reports/test-report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: reports/test-report.txt

  healthcheck:

    runs-on: ubuntu-latest

    steps:

      - name: API Status
        run: echo "API saudavel"

  deploy-staging:

    needs: test

    runs-on: ubuntu-latest

    environment: staging

    steps:

      - name: Deploy Staging
        run: |
          echo "Deploy para ambiente staging"